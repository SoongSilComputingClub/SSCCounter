services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssccounter-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16
    container_name: ssccounter-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ssccounter_postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  ssccounter_postgres_data:
